<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    font-weight: 800;
    src: url("../fonts/bricolage-800-latin.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #fdf6ec;
    font-family: "Bricolage Grotesque", sans-serif;
    overflow: hidden;
    position: relative;
  }
  .rayures {
    height: 26px;
    background: repeating-linear-gradient(90deg, #1d4ed8 0 52px, #ffffff 52px 104px);
    border-bottom: 5px solid #1b1b1f;
  }
  .rayures.bas { position: absolute; bottom: 0; left: 0; right: 0; border-bottom: 0; border-top: 5px solid #1b1b1f; }
  .inner { padding: 60px 80px 0; display: flex; align-items: center; gap: 60px; }
  h1 { font-size: 96px; line-height: 1.02; color: #1b1b1f; letter-spacing: -0.01em; }
  h1 .bleu { color: #1d4ed8; }
  .sous {
    font-family: system-ui, sans-serif; font-weight: 600;
    font-size: 34px; color: #1b1b1f; margin-top: 28px; line-height: 1.35;
  }
  .pastille {
    display: inline-block; margin-top: 30px;
    background: #f4732c; border: 5px solid #1b1b1f; border-radius: 999px;
    box-shadow: 7px 7px 0 #1b1b1f;
    padding: 14px 34px; font-size: 34px; transform: rotate(-2deg);
  }
  .hublot {
    flex-shrink: 0;
    width: 330px; height: 330px; border-radius: 50%;
    border: 22px solid #1d4ed8;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, #dbe6ff 55%, #b9cdfb 100%);
    box-shadow: 12px 12px 0 #1b1b1f, inset 0 0 0 12px #ffffff;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .hublot span { font-size: 44px; color: #16389c; line-height: 1.15; }
  .marque {
    font-size: 40px; color: #1b1b1f; margin-top: 44px;
  }
  .marque .point { color: #c2410c; }
</style>
</head>
<body>
  <div class="rayures"></div>
  <div class="inner">
    <div>
      <h1>On décroche.<br><span class="bleu">Toujours.</span></h1>
      <p class="sous">Le standard téléphonique IA<br>des laveries automatiques.</p>
      <p class="pastille">99 €/mois · sans engagement</p>
      <p class="marque">AlloLaverie<span class="point">.</span>fr</p>
    </div>
    <div class="hublot"><span>Machine 4<br>libérée à<br>22 h 41</span></div>
  </div>
  <div class="rayures bas"></div>
</body>
</html>
